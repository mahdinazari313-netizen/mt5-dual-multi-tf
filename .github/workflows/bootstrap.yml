name: Bootstrap, Build and Install Source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/tar-part-*.b64 > /tmp/mt5dual.tar.xz.b64
          base64 --decode /tmp/mt5dual.tar.xz.b64 > /tmp/mt5dual.tar.xz
          rm -rf /tmp/mt5dual-source
          mkdir -p /tmp/mt5dual-source
          tar -xJf /tmp/mt5dual.tar.xz -C /tmp/mt5dual-source
          test -d /tmp/mt5dual-source/MT5DualMultiTF/mt5dual
          cp -a /tmp/mt5dual-source/MT5DualMultiTF/. MT5DualMultiTF/

      - name: Create active root Build workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/build-apk.yml <<'EOF'
          name: Build APK

          on:
            push:
              branches: [ main ]
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout code
                  uses: actions/checkout@v4

                - name: Set up JDK 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Setup Android SDK
                  uses: android-actions/setup-android@v4

                - name: Ensure Android platform and build tools
                  shell: bash
                  run: |
                    sdkmanager "platforms;android-34" "build-tools;34.0.0"

                - name: Setup Gradle 8.2
                  uses: gradle/gradle-build-action@v3
                  with:
                    gradle-version: 8.2

                - name: Build Debug APK
                  run: gradle assembleDebug --no-daemon
                  working-directory: MT5DualMultiTF/mt5dual

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: mt5-dual-v1.0.2-debug
                    path: MT5DualMultiTF/mt5dual/app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.2
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: MT5DualMultiTF/mt5dual

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt5-dual-v1.0.2-debug
          path: MT5DualMultiTF/mt5dual/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit source and root workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap.yml
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add MT5 Dual Multi-TF v1.0.2 source and build workflow"
            git push
          fi
